<!doctype html>
<html>
  <head>
    <title>Lesson | LearNux</title>
    <link rel="stylesheet" href="general.css" />
    <link rel="stylesheet" href="learning.css" />
    <link rel="icon" type="image/png" href="assets/logo.png" />
  </head>

  <body>
    <nav class="navbar">
      <div class="nav-left-group">
        <a href="home.html" class="brand-link">
          <div class="nav-left">
            <img src="assets/logo.png" alt="LearNux Logo" class="nav-logo" />
            <span class="nav-brand">LearNux</span>
          </div>
        </a>

        <ul class="nav-links">
          <li><a href="home.html" class="nav-link">Home</a></li>
          <li><a href="overview.html" class="nav-link">Overview</a></li>
          <li><a href="about.html" class="nav-link">About Us</a></li>
          <li><a href="admin.html" class="nav-link" id="adminLink" style="display: none">Admin</a></li>
        </ul>
      </div>

      <div class="nav-right">
        <div class="profile-section" id="profileSection">
          <img src="assets/profile.png" alt="Profile" class="profile-icon" id="profileIcon" />
          <span class="username" id="usernameDisplay">Guest</span>

          <div class="profile-dropdown" id="profileDropdown">
            <a href="profile.html" id="viewProfile">View Profile</a>
            <a href="#" id="settings">Settings</a>
            <a href="#" id="logoutBtn">Logout</a>
          </div>
        </div>
      </div>
    </nav>

    <main class="learning-shell">
      <section class="lesson-header">
        <a href="ubuntu.html" class="back-link" id="distroBackLink">Back to Ubuntu</a>
        <div>
          <p class="eyebrow" id="moduleLabel">Ubuntu Module</p>
          <h1 id="lessonTitle">Loading lesson...</h1>
          <p id="lessonSummary"></p>
        </div>
        <div class="progress-pill" id="lessonProgress">Lesson 1 of 1</div>
      </section>

      <section class="storyboard" id="storyboard"></section>

      <section class="lesson-actions">
        <button type="button" class="primary-button" id="completeLesson">Mark Complete</button>
        <a class="quiz-button" id="quizLink" href="#">Take Quiz</a>
        <button type="button" class="secondary-button" id="previousLesson">Previous</button>
        <button type="button" class="secondary-button" id="nextLesson">Next</button>
      </section>
    </main>

    <script src="home.js"></script>
    <script src="lesson.js"></script>
  </body>
</html>
