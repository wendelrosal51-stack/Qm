<!doctype html>
<html>
  <head>
    <title>Quiz | LearNux</title>

    <nav class="navbar">

            <span class="nav-brand">LearNux</span>
          </div>
        </a>

        <ul class="nav-links">
          <li><a href="home.html" class="nav-link">Home</a></li>
          <li><a href="ubuntu.html" class="nav-link active">Ubuntu</a></li>
          <li><a href="mint.html" class="nav-link">Mint</a></li>
